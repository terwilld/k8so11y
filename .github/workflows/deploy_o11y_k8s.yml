name: Deploy to GKE

on:
  push:
    branches:
      - main # Change this to your preferred branch
  workflow_dispatch: {}
  schedule:
    # 8:00 AM America/New_York (EDT, UTC-4). GitHub Actions cron is always UTC and
    # does not observe DST, so this runs at 7:00 AM ET during EST (winter).
    - cron: '0 12 * * *'

jobs:
  deploy-to-gke:
    name: Authenticate and Connect to GKE
    runs-on: ubuntu-latest

    # Required permissions to obtain an OIDC ID token for Workload Identity Federation
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 1: Authenticate with Google Cloud using Workload Identity Federation
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        token_format: 'access_token'
        workload_identity_provider: 'projects/771102955716/locations/global/workloadIdentityPools/github-actions/providers/github-actions-oidc' # 
        service_account: 'github-actions--k8s-o11y@ukg-training-fresh.iam.gserviceaccount.com'

    # Step 2: Set up gcloud CLI (needed to create the cluster)
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    # Step 3: Create the GKE cluster if it doesn't already exist, matching my-cluster's spec
    - name: Create o11y-cluster
      run: |
        if gcloud container clusters describe o11y-cluster \
            --project=ukg-training-fresh \
            --zone=us-central1-a &> /dev/null; then
          echo "Cluster o11y-cluster already exists, skipping creation."
        else
          gcloud container clusters create o11y-cluster \
            --project=ukg-training-fresh \
            --zone=us-central1-a \
            --release-channel=regular \
            --num-nodes=1 \
            --machine-type=e2-standard-4 \
            --disk-type=pd-balanced \
            --disk-size=40 \
            --image-type=COS_CONTAINERD \
            --max-pods-per-node=110 \
            --network=default \
            --subnetwork=default \
            --enable-ip-alias \
            --enable-managed-prometheus \
            --addons=HorizontalPodAutoscaling,HttpLoadBalancing,GcePersistentDiskCsiDriver,NodeLocalDNS
        fi

    # Step 4: Confirm the cluster has actually reached RUNNING before we touch it,
    # then give it a brief buffer for the API server/nodes to finish settling.
    - name: Wait for cluster to be ready
      run: |
        for i in {1..30}; do
          STATUS=$(gcloud container clusters describe o11y-cluster \
            --project=ukg-training-fresh \
            --zone=us-central1-a \
            --format='value(status)')
          echo "Cluster status: $STATUS"
          if [ "$STATUS" == "RUNNING" ]; then
            break
          fi
          sleep 10
        done

        if [ "$STATUS" != "RUNNING" ]; then
          echo "Cluster o11y-cluster did not reach RUNNING status in time." >&2
          exit 1
        fi

        echo "Cluster is RUNNING, waiting 30s for nodes/API server to settle..."
        sleep 30

    # Step 5: Set up the GKE credentials context
    - name: Get GKE Credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: 'o11y-cluster'
        location: 'us-central1-a'

    # Step 7: Set up Helm
    - name: Set up Helm
      uses: azure/setup-helm@v4

    # Step 8: Install the Grafana Cloud k8s-monitoring stack via Helm.
    # Values live in manifests/grafana-k8s-monitoring-values.yml; secrets are
    # substituted into its ${VAR} placeholders at run time, never hardcoded here.
    - name: Deploy Grafana Cloud k8s-monitoring
      env:
        GRAFANA_METRICS_USERNAME: ${{ secrets.GRAFANA_CLOUD_METRICS_USERNAME }}
        GRAFANA_LOGS_USERNAME: ${{ secrets.GRAFANA_CLOUD_LOGS_USERNAME }}
        GRAFANA_FLEET_USERNAME: ${{ secrets.GRAFANA_CLOUD_FLEET_USERNAME }}
        GRAFANA_CLOUD_ACCESS_TOKEN: ${{ secrets.GRAFANA_CLOUD_ACCESS_TOKEN }}
        GRAFANA_TRACES_USERNAME: ${{ secrets.GRAFANA_CLOUD_TRACES_USERNAME }}
        GRAFANA_CLOUD_TRACES_TOKEN: ${{ secrets.GRAFANA_CLOUD_TRACES_TOKEN }}
      run: |
        helm repo add grafana https://grafana.github.io/helm-charts
        helm repo update
        envsubst < manifests/grafana-k8s-monitoring-values.yml | \
          helm upgrade --install --atomic --timeout 300s grafana-k8s-monitoring grafana/k8s-monitoring \
            --version "^4" --namespace "monitoring" --create-namespace --values -

    # Step 6: Enable Service Graph in Alloy (idempotent)
    - name: Enable Service Graph in Alloy Singleton
      run: |
        set +e  # Don't fail on errors in this step

        echo "Checking if service graph is already enabled..."
        CONFIG=$(kubectl get configmap -n monitoring grafana-k8s-monitoring-alloy-singleton -o jsonpath='{.data.config\.alloy}' 2>/dev/null)

        if echo "$CONFIG" | grep -q "otelcol.connector.servicegraph"; then
          echo "✓ Service graph already enabled, skipping configuration"
          exit 0
        fi

        echo "Service graph not found, enabling now..."

        # Save current config
        kubectl get configmap -n monitoring grafana-k8s-monitoring-alloy-singleton -o jsonpath='{.data.config\.alloy}' > /tmp/alloy-config.river 2>/dev/null
        if [ $? -ne 0 ]; then
          echo "⚠ Warning: Could not retrieve Alloy config, skipping service graph enablement"
          exit 0
        fi

        # Remove incorrect servicegraph routing from k8sattributes if present
        sed -i.bak 's/, otelcol\.connector\.servicegraph\.default\.input//g' /tmp/alloy-config.river

        # Add servicegraph to OTLP receiver output
        sed -i.bak 's/traces = \[otelcol\.processor\.resourcedetection\.default\.input\]/traces = [otelcol.connector.servicegraph.default.input, otelcol.processor.resourcedetection.default.input]/' /tmp/alloy-config.river

        # Add servicegraph connector definition after OTLP receiver
        sed -i.bak '/} \/\/ otelcol\.receiver\.otlp "receiver"/a\
\
  \/\/ Service Graph Connector\
  otelcol.connector.servicegraph "default" {\
    dimensions = ["http.method", "http.target"]\
\
    output {\
      metrics = argument.metrics_destinations.value\
    }\
  } \/\/ otelcol.connector.servicegraph "default"' /tmp/alloy-config.river

        # Patch ConfigMap
        CONFIG=$(cat /tmp/alloy-config.river | jq -Rs .)
        kubectl patch configmap -n monitoring grafana-k8s-monitoring-alloy-singleton --type merge -p "{\"data\":{\"config.alloy\":$CONFIG}}" 2>/dev/null
        if [ $? -ne 0 ]; then
          echo "⚠ Warning: Failed to patch ConfigMap, continuing deployment"
          exit 0
        fi

        echo "✓ Service graph configuration patched"

        # Restart pod to pick up changes
        echo "Restarting Alloy singleton pod..."
        kubectl rollout restart deployment grafana-k8s-monitoring-alloy-singleton -n monitoring 2>/dev/null

        # Wait for pod to be ready
        if kubectl rollout status deployment/grafana-k8s-monitoring-alloy-singleton -n monitoring --timeout=120s 2>/dev/null; then
          echo "✓ Alloy singleton pod restarted successfully"

          # Verify pod is healthy
          sleep 5
          POD=$(kubectl get pod -n monitoring -l app.kubernetes.io/instance=grafana-k8s-monitoring -l app.kubernetes.io/name=alloy -l alloy.grafana.com/role=singleton -o name | head -1)
          if [ -n "$POD" ]; then
            STATUS=$(kubectl get $POD -n monitoring -o jsonpath='{.status.phase}')
            if [ "$STATUS" = "Running" ]; then
              echo "✓ Service graph enabled and pod is healthy"
            else
              echo "⚠ Warning: Pod status is $STATUS, service graph may not be fully operational"
            fi
          fi
        else
          echo "⚠ Warning: Pod restart timed out, service graph may be pending"
        fi

        exit 0  # Don't fail the workflow on service graph errors

    # Step 7: Run your kubectl or deployment commands
    - name: Deploy Nginx & Verify GKE Cluster Connection
      run: |
        kubectl get nodes
        kubectl apply -f manifests/nginx-configmap.yml
        kubectl apply -f manifests/nginx-deployment.yml
        kubectl apply -f manifests/nginx-service.yml
        kubectl apply -f manifests/nginx-metrics-service.yml

        echo "Waiting up to 5 minutes for IP address..."
        kubectl wait --namespace default --for=jsonpath='{.status.loadBalancer.ingress[0].ip}' service/nginx-service --timeout=300s

        echo "Assigned Public IP:"
        kubectl get svc nginx-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}'

    # Step 7: Install the demo and expose the frontend proxy service via LoadBalancer. This is a simple demo that generates traces, metrics, and logs to verify that the Grafana Cloud k8s-monitoring stack is working.
    - name: Check whether release is already deployed
      id: helm_check
      shell: bash
      run: |
        RELEASE="my-otel-demo"
        NAMESPACE="default"

        if helm list -n "$NAMESPACE" --deployed --filter "^${RELEASE}$" | awk 'NR>1 {print $1}' | grep -qx "$RELEASE"; then
          echo "already_deployed=true" >> "$GITHUB_OUTPUT"
          echo "already_deployed=true"          
        else
          echo "already_deployed=false" >> "$GITHUB_OUTPUT"
          echo "already_deployed=false"
        fi


    - name: Deploy OTel Demo via Helm
      if: steps.helm_check.outputs.already_deployed != 'true'
      env:
        ALREADY_DEPLOYED: ${{ steps.helm_check.outputs.already_deployed }}
      run: |
        echo "already_deployed=${ALREADY_DEPLOYED}"
    
        helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
        helm repo update
    
        helm upgrade --install my-otel-demo \
          open-telemetry/opentelemetry-demo \
          -n default \
          --create-namespace
          
    - name: Expose OTel Frontend
      run: |
        kubectl patch svc frontend-proxy -p '{"spec":{"type":"LoadBalancer"}}'

        echo "Waiting up to 5 minutes for frontend proxy IP address..."
        kubectl wait \
          --namespace default \
          --for=jsonpath='{.status.loadBalancer.ingress[0].ip}' \
          service/frontend-proxy \
          --timeout=300s

        echo "Assigned Public IP for OTel Frontend Proxy:"
        kubectl get svc frontend-proxy -o jsonpath='{.status.loadBalancer.ingress[0].ip}'

        kubectl patch svc frontend-proxy -p '{"spec":{"loadBalancerIP":"34.136.47.170"}}'


    - name: Apply OTel Collector configuration
      run: |
        echo "Applying OpenTelemetry Collector ConfigMap..."

        kubectl apply -f manifests/otel-collector-agent.yaml

        echo "Restarting OpenTelemetry Collector DaemonSet..."

        kubectl rollout restart daemonset otel-collector-agent -n default

        echo "Waiting for OpenTelemetry Collector pods..."

        kubectl rollout status daemonset/otel-collector-agent \
          -n default \
          --timeout=300s

        echo "OpenTelemetry Collector status:"
        kubectl get pods -n default | grep otel-collector
