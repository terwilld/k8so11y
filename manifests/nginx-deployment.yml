apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-prometheus
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
      annotations:
        # Standard Prometheus scraping annotations
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
        prometheus.io/path: "/metrics"
        prometheus.io/scheme: "http"
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/metrics.path: "/metrics"
        k8s.grafana.com/metrics.portNumber: "9113"
        k8s.grafana.com/metrics.scheme: "http"
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/conf.d
      
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:latest
        args:
        - --nginx.scrape-uri=http://127.0.0.1/metrics
        ports:
        - containerPort: 9113
          name: metrics
      
      volumes:
      - name: config-volume
        configMap:
          name: nginx-config